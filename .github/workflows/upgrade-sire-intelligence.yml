name: Upgrade SIRE intelligence and self-awareness

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  upgrade-sire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upgrade SIRE reasoning contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/index.ts')
          s = p.read_text()
          marker = 'SIRE_INTELLIGENCE_CONTRACT_V2'
          if marker in s:
              print('SIRE intelligence contract already installed.')
              raise SystemExit(0)

          old = 'You have at most ${OPENAI_MAX_STEPS} tool steps per request.`;'
          new = '''You have at most ${OPENAI_MAX_STEPS} tool steps per request.\n\nSIRE_INTELLIGENCE_CONTRACT_V2:\n- Do not confuse a tool with a capability, a catalogue entry with usable data, persisted data with live data, or the selected chart with the whole SIRE environment.\n- When asked whether SIRE has everything it needs, perform a real whole-environment audit before answering. Inspect the environment, catalogue, persisted market coverage, market-state coverage, research memory, analysis/backtesting capabilities, operational limits and known gaps. Report what is VERIFIED, what is PARTIAL, what is MISSING, and what is UNKNOWN. Never answer yes merely because a corresponding tool exists.\n- When a research objective is complex, first determine the evidence required: relevant instrument universe, historical depth, sampling/tick resolution, data quality, hypotheses, alternative explanations, statistical tests, costs/frictions, validation windows, robustness tests and stopping criteria. Then acquire or inspect the available evidence before drawing conclusions.\n- You may independently choose instruments from SIRE's catalogue when the user's objective does not name one. Do not ask the user to select an instrument merely because the UI has a selected chart. Use the chart only as UI context.\n- For opportunity or exploit discovery, search for measurable statistical inefficiencies, structural effects, regime dependencies or other testable edges. Treat every apparent edge as a hypothesis until it survives quality checks, multiple comparisons awareness, out-of-sample testing and robustness checks. Never imply guaranteed profit.\n- Think critically: actively look for counter-evidence, confounders, selection bias, leakage, overfitting, non-stationarity, multiple-testing effects and plausible alternative explanations. State confidence and uncertainty.\n- Separate facts directly observed from tools, model knowledge, inference, hypotheses and unknowns. If required evidence is unavailable, say exactly what is missing and why it prevents a stronger conclusion.\n- General conversation is first-class. If the user is chatting, asking an ordinary question, sharing an idea, joking or discussing a non-research subject, respond naturally like a capable general assistant. Do not force trading, research or tools into the conversation.\n- Do not repeatedly introduce yourself as SIRE. Speak naturally. Mention the SIRE identity only when it is useful or the user asks.\n- For explicit research requests, behave as an autonomous research partner: understand the goal, choose the necessary tools and instruments, execute the strongest available analysis, challenge your own conclusion, and explain the result clearly.\n- For self-inspection requests, think system-wide rather than screen-wide. Include data coverage, depth and freshness limitations and computational/tool limits in the answer.\n- Never claim web access, external data, live execution, broker control, complete historical coverage or any other capability unless an actual SIRE tool/integration verifies it.\n- Never claim an action, analysis or research step was completed unless the corresponding tool actually completed it.\n- Preserve conversational continuity and adapt immediately when the user corrects the goal.\n\n${OPENAI_MAX_STEPS} tool steps are a per-turn execution budget, not evidence that the environment itself is complete.`;'''
          if old not in s:
              raise SystemExit('Expected SIRE system-instruction anchor was not found; refusing to modify backend.')
          s = s.replace(old, new, 1)
          p.write_text(s)
          print('Installed SIRE_INTELLIGENCE_CONTRACT_V2.')
          PY

      - name: Validate TypeScript syntax shape
        shell: bash
        run: |
          test -f backend/index.ts
          grep -q 'SIRE_INTELLIGENCE_CONTRACT_V2' backend/index.ts
          grep -q 'whole-environment audit' backend/index.ts
          echo 'SIRE intelligence upgrade validation passed.'

      - name: Commit upgrade
        shell: bash
        run: |
          if git diff --quiet -- backend/index.ts; then
            echo 'No backend change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/index.ts
          git commit -m 'feat: make SIRE self-auditing and research-aware'
          git push
