name: Finalize SIRE environment key

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-sire-env.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use NVIDIA environment variable directly
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('backend/index.ts')
          s = p.read_text()
          s = s.replace("import { router, json, error, db, secrets } from '@appdeploy/sdk';", "import { router, json, error, db } from '@appdeploy/sdk';")
          s = s.replace("const apiKey = await secrets.readSecret('NVIDIA_API_KEY');", "const apiKey = process.env.NVIDIA_API_KEY;")
          s = s.replace("const names = await secrets.listSecretNames();\n      return json({ ok: true, provider: 'NVIDIA', configured: names.includes('NVIDIA_API_KEY'), model: OPENAI_MODEL });", "return json({ ok: true, provider: 'NVIDIA', configured: Boolean(process.env.NVIDIA_API_KEY), model: OPENAI_MODEL });")
          p.write_text(s)
          PY
      - name: Commit final provider configuration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/index.ts
          git rm -f .github/workflows/final-sire-env.yml
          git commit -m "Read SIRE NVIDIA key from environment"
          git push
