name: SIRE paper lifecycle tests
on:
  pull_request:
    branches: [render-migration]
permissions:
  contents: read
jobs:
  paper-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node --test backend/sire-paper-exchange.test.mjs
      - run: npm run build
