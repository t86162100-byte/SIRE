name: Fix NVIDIA request format

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-nvidia-request:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove unsupported provider-specific request field
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/index.ts')
          s = p.read_text()
          old = "chat_template_kwargs: { enable_thinking: true, force_nonempty_content: true }"
          if old in s:
              s = s.replace(", " + old, "")
              p.write_text(s)
              print('Removed unsupported NVIDIA chat_template_kwargs field.')
          else:
              print('No unsupported chat_template_kwargs field found; nothing to change.')
          PY

      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet -- backend/index.ts; then
            echo 'No change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/index.ts
          git commit -m 'fix: remove unsupported NVIDIA chat template request parameter'
          git push
