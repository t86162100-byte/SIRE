name: Execute deterministic AI cleanup

on:
  workflow_dispatch:
  push:
    branches: [render-migration]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: render-migration
          fetch-depth: 0

      - name: Apply cleanup
        run: node .github/cleanup-ai-final.cjs

      - name: Remove cleanup tooling
        run: rm -f .github/cleanup-ai-final.cjs .github/workflows/execute-ai-cleanup.yml

      - name: Install and build
        run: npm install && npm run build

      - name: Verify no legacy providers or models remain
        run: |
          set -e
          if git grep -n -I -E 'openrouter|openai\.com|OPENAI_API_KEY|OPENAI_MODEL|OPENAI_MAX_|nvidia|NVIDIA_API_KEY|gemini|googleapis\.com|generativelanguage|bazaarlink|BazaarLink|OPEN_ROUTER_API_KEY|OPENROUTER_KEY|moonshotai/kimi-k3|deepseek-ai/deepseek-v4-pro-0813|openai/gpt-oss-120b|nvidia/nemotron-3-super-120b-a12b|gpt-5\.6-luna'; then
            echo 'Legacy AI/provider trace found.'
            exit 1
          fi
          test ! -e backend/openrouter-team.ts
          test ! -e backend/openrouter-env.mjs
          test ! -e backend/openrouter-native-fetch.mjs
          echo 'Repository provider/model scan is clean.'

      - name: Commit and push verified cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No cleanup changes detected.'; exit 1; }
          git commit -m 'chore: remove legacy AI integrations completely'
          git push origin render-migration
