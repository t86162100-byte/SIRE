name: Fix SIRE NVIDIA tool calling

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Switch to NVIDIA-hosted GPT-OSS with verified tool calling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/index.ts')
          s = p.read_text()
          old = "const OPENAI_MODEL = 'nvidia/nemotron-3-super-120b-a12b';"
          new = "const OPENAI_MODEL = 'openai/gpt-oss-120b';"
          if old not in s:
              raise SystemExit('Expected SIRE NVIDIA model declaration was not found; refusing to modify backend.')
          s = s.replace(old, new, 1)
          s = s.replace("temperature: 1, top_p: 0.95, max_tokens: 8192", "temperature: 0.6, top_p: 0.95, max_tokens: 16384", 1)
          s = s.replace("provenance: 'NVIDIA Nemotron 3 Super intelligence operating inside the SIRE environment'", "provenance: 'NVIDIA-hosted GPT-OSS 120B intelligence operating inside the SIRE environment'", 2)
          p.write_text(s)
          PY
      - name: Commit backend fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/index.ts
          git rm .github/workflows/fix-sire-tool-calling.yml
          git commit -m 'fix: restore SIRE tool calling with NVIDIA-hosted GPT-OSS'
          git push
