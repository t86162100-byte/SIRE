name: SIRE Free Autonomous Market Observer

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout autonomous engine branch
        uses: actions/checkout@v4
        with:
          ref: render-migration
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Observe Deriv public market state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AUTONOMOUS_STATE_ISSUE_NUMBER: "10"
          SIRE_AUTONOMOUS_SYMBOLS: "WLDAUD"
        run: npm run autonomous:free-poll
