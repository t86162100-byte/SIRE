name: Final provider scrub

on:
  push:
    branches: [render-migration]

permissions:
  contents: write

jobs:
  scrub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: render-migration
          fetch-depth: 0
      - name: Remove remaining provider-era names
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('backend/index.ts')
          s = p.read_text()
          replacements = {
            'GPT_TOOL_MANIFEST': 'RESEARCH_TOOL_MANIFEST',
            'gptTool': 'researchTool',
            'GPT Research Gateway': 'Research Gateway',
            'SIRE GPT Research Gateway': 'SIRE Research Gateway',
            '/api/sire/gpt/': '/api/sire/research/',
            'SIRE_MAX_ANALYSIS_TICKS': 'BACKTEST_MAX_TICKS',
            'SIRE_MAX_TICKS': 'MAX_TICKS',
          }
          for a,b in replacements.items():
            s = s.replace(a,b)
          p.write_text(s)
          PY
          rm -f AI_ROUTING_TRIGGER.md
          find . -type f \( -iname '*openrouter*' -o -iname '*nvidia*' -o -iname '*gemini*' -o -iname '*bazaar*' -o -iname '*ai-routing*' -o -iname '*ai_routing*' \) -not -path './.git/*' -print -delete
          # Remove this one-shot workflow after it completes.
          rm -f .github/workflows/final-provider-scrub.yml
      - name: Verify provider traces are absent
        shell: bash
        run: |
          set -euo pipefail
          if git grep -I -n -E 'openrouter|OPENROUTER|openai\.com|OPENAI_API_KEY|OPENAI_MODEL|OPENAI_MAX_|nvidia|NVIDIA_API_KEY|gemini|GEMINI_API_KEY|googleapis\.com|generativelanguage|bazaar|BazaarLink|moonshotai/kimi|deepseek-ai/deepseek|gpt-oss-120b|nemotron-3-super|AI_ROUTING|GPT_TOOL_MANIFEST|gptTool|SIRE_MAX_TICKS|SIRE_MAX_ANALYSIS_TICKS' -- . ':!package-lock.json'; then
            echo 'Provider/AI traces remain'; exit 1
          fi
          if git grep -I -n -E '/api/sire/gpt/|SIRE GPT' -- .; then
            echo 'Old GPT gateway naming remains'; exit 1
          fi
          npm install --no-audit --no-fund
          npm run build
      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SIRE cleanup bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No cleanup changes to commit'
            exit 0
          fi
          git commit -m 'chore: remove remaining legacy AI naming and traces'
          git push origin HEAD:render-migration
