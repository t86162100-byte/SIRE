name: Fix chart build

on:
  push:
    branches: [render-migration]

permissions:
  contents: write

jobs:
  fix:
    if: contains(github.event.head_commit.message, 'feat: add shared council chart analysis contract')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: render-migration
      - name: Fix out-of-scope currentInterval reference
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("src/FinancialChart.tsx")
          s = p.read_text()
          old = "timeframe: targetInterval || currentInterval, tool"
          new = "timeframe: targetInterval || String(widgetRef.current?.interval?.() || ''), tool"
          if old not in s:
              raise SystemExit("Expected build-failure pattern not found")
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/FinancialChart.tsx
          git commit -m "fix: resolve chart action build error"
          git push origin render-migration
