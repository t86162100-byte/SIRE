name: Clean SIRE NVIDIA migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-sire-nvidia.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean provider references
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('backend/index.ts')
          s = p.read_text()
          s = s.replace("BazaarLink is not configured. Add NVIDIA_API_KEY", "NVIDIA is not configured. Add NVIDIA_API_KEY")
          s = s.replace("The OpenAI connection timed out.", "The NVIDIA connection timed out.")
          s = s.replace("The connection to OpenAI was interrupted.", "The connection to NVIDIA was interrupted.")
          p.write_text(s)
          PY
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/index.ts
          git rm -f .github/workflows/cleanup-sire-nvidia.yml
          git commit -m "Clean SIRE NVIDIA provider references"
          git push
