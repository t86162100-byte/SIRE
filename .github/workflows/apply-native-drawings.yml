name: Apply native drawings POC

on:
  push:
    branches: [render-migration]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: render-migration
          fetch-depth: 0

      - name: Patch chart integration
        shell: python
        run: |
          from pathlib import Path

          chart = Path('src/NativeMarketChart.tsx')
          text = chart.read_text()
          marker = "import { useEffect, useRef } from 'react';"
          if "attachSireNativeDrawingController" not in text:
              text = text.replace(
                  marker,
                  marker + "\nimport { attachSireNativeDrawingController } from './chart/drawings/SireNativeDrawingController';",
                  1,
              )

          old = "    const series = chart.addSeries(CandlestickSeries, { upColor: '#22c55e', downColor: '#ef4444', borderUpColor: '#22c55e', borderDownColor: '#ef4444', wickUpColor: '#22c55e', wickDownColor: '#ef4444', priceLineVisible: true, lastValueVisible: true, priceLineWidth: 1 });\n    chartRef.current = chart;"
          new = "    const series = chart.addSeries(CandlestickSeries, { upColor: '#22c55e', downColor: '#ef4444', borderUpColor: '#22c55e', borderDownColor: '#ef4444', wickUpColor: '#22c55e', wickDownColor: '#ef4444', priceLineVisible: true, lastValueVisible: true, priceLineWidth: 1 });\n    const drawingController = attachSireNativeDrawingController(chart, series, host.parentElement ?? host);\n    chartRef.current = chart;"
          if old not in text:
              raise SystemExit('chart setup marker not found')
          text = text.replace(old, new, 1)

          old_cleanup = "    return () => { chart.remove(); chartRef.current = null; seriesRef.current = null; initializedRef.current = false; firstDataRef.current = false; };"
          new_cleanup = "    return () => { drawingController.destroy(); chart.remove(); chartRef.current = null; seriesRef.current = null; initializedRef.current = false; firstDataRef.current = false; };"
          if old_cleanup not in text:
              raise SystemExit('cleanup marker not found')
          text = text.replace(old_cleanup, new_cleanup, 1)

          old_bar = "    <div className=\"native-bottom-glass-bar\" aria-hidden=\"true\">"
          new_bar = "    <div className=\"native-bottom-glass-bar\">"
          if old_bar not in text:
              raise SystemExit('bottom bar marker not found')
          text = text.replace(old_bar, new_bar, 1)

          old_timeframe = "      <div className=\"native-bottom-timeframe-viewport\">\n        <div className=\"native-bottom-timeframe-track\">\n          <span className=\"native-bottom-timeframe-side native-bottom-timeframe-previous\" />\n          <span className=\"native-bottom-timeframe-current\">1m</span>\n          <span className=\"native-bottom-timeframe-side native-bottom-timeframe-next\" />\n        </div>\n      </div>\n"
          new_timeframe = old_timeframe + "      <button type=\"button\" className=\"sire-drawing-toggle\" data-sire-drawing-toggle aria-label=\"Drawing tools\" aria-expanded=\"false\">✎</button>\n      <div className=\"sire-drawing-palette\" data-sire-drawing-palette hidden>\n        <div className=\"sire-drawing-palette-tools\">\n          <button type=\"button\" data-sire-drawing-tool=\"trend\">Trend</button>\n          <button type=\"button\" data-sire-drawing-tool=\"horizontal\">H-Line</button>\n          <button type=\"button\" data-sire-drawing-tool=\"ray\">Ray</button>\n          <button type=\"button\" data-sire-drawing-tool=\"rectangle\">Box</button>\n        </div>\n        <div className=\"sire-drawing-palette-actions\">\n          <span data-sire-drawing-status />\n          <button type=\"button\" data-sire-drawing-undo>Undo</button>\n          <button type=\"button\" data-sire-drawing-clear>Clear</button>\n        </div>\n      </div>\n"
          if old_timeframe not in text:
              raise SystemExit('timeframe JSX marker not found')
          text = text.replace(old_timeframe, new_timeframe, 1)
          chart.write_text(text)

          css = Path('src/nativeTerminal.css')
          css_text = css.read_text()
          if '.sire-drawing-toggle' not in css_text:
              css_text += "\n.sire-drawing-toggle{position:relative;pointer-events:auto;width:34px;height:34px;margin-left:4px;border:1px solid rgba(90,120,150,.18);border-radius:8px;background:rgba(13,20,29,.68);color:#a9b7c7;font-size:18px;line-height:1;display:grid;place-items:center;flex:0 0 34px}.sire-drawing-toggle.active{color:#f4f8fc;border-color:rgba(0,145,255,.65);background:rgba(0,100,190,.24);box-shadow:0 0 12px rgba(0,130,255,.22)}.sire-drawing-palette{position:absolute;left:188px;bottom:56px;min-width:250px;padding:8px;border:1px solid rgba(70,110,150,.35);border-radius:10px;background:rgba(8,13,20,.96);box-shadow:0 10px 28px rgba(0,0,0,.35),0 0 18px rgba(0,120,255,.14);backdrop-filter:blur(14px);pointer-events:auto;box-sizing:border-box}.sire-drawing-palette[hidden]{display:none}.sire-drawing-palette-tools{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.sire-drawing-palette button{min-height:32px;border:1px solid rgba(100,120,145,.16);border-radius:7px;background:rgba(22,29,38,.72);color:#aeb9c6;font-size:9px;font-weight:600}.sire-drawing-palette button:hover,.sire-drawing-palette button.active{color:#f4f8fc;border-color:rgba(0,145,255,.62);background:rgba(0,100,190,.22)}.sire-drawing-palette-actions{display:flex;align-items:center;gap:5px;margin-top:7px}.sire-drawing-palette-actions span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#738295;font-size:8px}.sire-drawing-palette-actions button{padding:0 8px}.native-bottom-glass-bar{pointer-events:none}.sire-drawing-palette,.sire-drawing-toggle{pointer-events:auto}@media(max-width:800px){.sire-drawing-palette{left:150px;right:0;min-width:0;width:calc(100vw - 164px)}.sire-drawing-palette-tools{grid-template-columns:repeat(2,1fr)}}\n"
              css.write_text(css_text)

          workflow = Path('.github/workflows/apply-native-drawings.yml')
          workflow.unlink()

      - name: Commit patched chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/NativeMarketChart.tsx src/nativeTerminal.css src/chart/drawings/SireNativeDrawingController.ts .github/workflows/apply-native-drawings.yml
          git commit -m "Add isolated native chart drawing tools" || exit 0
          git push origin render-migration
