name: Wire SIRE autonomy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Wire autonomy layer
        run: node scripts/upgrade-sire-autonomy.mjs

      - name: Commit wiring
        run: |
          git config user.name "SIRE Autonomy"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/index.ts backend/sire-autonomy.ts scripts/upgrade-sire-autonomy.mjs .github/workflows/wire-sire-autonomy.yml
          if git diff --cached --quiet; then
            echo "No wiring changes required"
          else
            git commit -m "Wire autonomous SIRE market intelligence"
            git push
          fi
