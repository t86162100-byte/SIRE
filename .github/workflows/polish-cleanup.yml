name: Polish cleaned backend

on:
  push:
    branches: [render-migration]

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: render-migration
          fetch-depth: 0
      - run: node .github/polish-cleanup.cjs
      - run: rm -f .github/polish-cleanup.cjs .github/workflows/polish-cleanup.yml
      - run: npm install && npm run build
      - run: |
          set -e
          if git grep -n -I -E 'openrouter|openai\.com|OPENAI_API_KEY|OPENAI_MODEL|OPENAI_MAX_|nvidia|NVIDIA_API_KEY|gemini|googleapis\.com|generativelanguage|bazaarlink|BazaarLink|OPEN_ROUTER_API_KEY|OPENROUTER_KEY|moonshotai/kimi-k3|deepseek-ai/deepseek-v4-pro-0813|openai/gpt-oss-120b|nvidia/nemotron-3-super-120b-a12b|gpt-5\.6-luna'; then exit 1; fi
          test ! -e backend/openrouter-team.ts
          test ! -e backend/openrouter-env.mjs
          test ! -e backend/openrouter-native-fetch.mjs
          test ! -e DEPLOY_AI_RUNTIME_2026-09-14.md
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No polish changes.'; exit 1; }
          git commit -m 'chore: polish provider-neutral backend cleanup'
          git push origin render-migration
