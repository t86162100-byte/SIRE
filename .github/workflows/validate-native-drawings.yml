name: Validate native drawings

on:
  push:
    branches: [render-migration]

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: render-migration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Build
        run: npm install --no-audit --no-fund && npm run build
      - name: Remove temporary validator
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/validate-native-drawings.yml
          git add .github/workflows/validate-native-drawings.yml
          git commit -m "Remove temporary drawing validator" || true
          git push origin render-migration || true
