name: Wallet verification

on:
  push:
    branches:
      - render-migration
    paths:
      - 'src/wallet/**'
      - 'src/sireWallet.ts'
      - 'src/SireWalletPanel.tsx'
      - 'mobile/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/wallet-verification.yml'
  pull_request:
    paths:
      - 'src/wallet/**'
      - 'src/sireWallet.ts'
      - 'src/SireWalletPanel.tsx'
      - 'mobile/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/wallet-verification.yml'

permissions:
  contents: read

jobs:
  wallet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Reconcile dependency lock and install
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
        env:
          RENDER: 'true'
      - name: Test wallet provider and chain capability gates
        run: npm run test:wallet
      - name: Verify production web build
        run: npm run build
