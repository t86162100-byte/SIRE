name: Refresh Binance market catalogue

on:
  push:
    branches: [render-migration]
    paths:
      - '.github/workflows/update-binance-catalogue.yml'
      - 'src/App.tsx'
      - 'backend/market-catalog.ts'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: render-migration

      - name: Fetch official Binance catalogues
        shell: python
        run: |
          import json, urllib.request, urllib.error, os
          from pathlib import Path

          def get(url, attempts=4, timeout=45):
              req = urllib.request.Request(url, headers={
                  "Accept": "application/json",
                  "User-Agent": "SIRE-Binance-Catalogue/1.0",
              })
              last = None
              for attempt in range(attempts):
                  try:
                      with urllib.request.urlopen(req, timeout=timeout) as r:
                          return json.loads(r.read().decode("utf-8"))
                  except Exception as e:
                      last = e
                      print(f"fetch attempt {attempt + 1}/{attempts} failed:", url, e)
                      if attempt + 1 < attempts:
                          import time
                          time.sleep(2 * (attempt + 1))
              raise last

          # Binance may return HTTP 451 to hosted runners. For every catalogue
          # family, accept only a response containing a real symbols[] array.
          # data-api.binance.vision is Binance's public market-data host.
          def unwrap_symbol_payload(value, depth=0):
              if depth > 5:
                  return None
              if isinstance(value, dict):
                  if isinstance(value.get("symbols"), list) and value["symbols"]:
                      return value
                  for key in ("data", "content", "text", "body", "result"):
                      if key in value:
                          found = unwrap_symbol_payload(value[key], depth + 1)
                          if found:
                              return found
                  return None
              if isinstance(value, str):
                  text_value = value.strip()
                  candidates = []
                  if "```" in text_value:
                      for chunk in text_value.split("```"):
                          chunk = chunk.strip()
                          if chunk.startswith("json"):
                              chunk = chunk[4:].strip()
                          if chunk:
                              candidates.append(chunk)
                  candidates.append(text_value)
                  symbol_marker = text_value.find('"symbols"')
                  if symbol_marker >= 0:
                      start = text_value.rfind("{", 0, symbol_marker)
                      if start >= 0:
                          try:
                              decoded, _ = json.JSONDecoder().raw_decode(text_value[start:])
                              found = unwrap_symbol_payload(decoded, depth + 1)
                              if found:
                                  return found
                          except Exception:
                              pass
                  first = text_value.find("{")
                  last = text_value.rfind("}")
                  if first >= 0 and last > first:
                      candidates.append(text_value[first:last + 1])
                  for candidate in candidates:
                      try:
                          decoded = json.loads(candidate)
                          found = unwrap_symbol_payload(decoded, depth + 1)
                          if found:
                              return found
                      except Exception:
                          pass
                  return None
              return None

          def get_first_symbols(urls, attempts=1, timeout=12):
              last = None
              for url in urls:
                  try:
                      raw_payload = get(url, attempts=attempts, timeout=timeout)
                      payload = unwrap_symbol_payload(raw_payload) or raw_payload
                      rows = payload.get("symbols") if isinstance(payload, dict) else None
                      if isinstance(rows, list) and rows:
                          print("symbol source succeeded:", url, "symbols:", len(rows))
                          return payload
                      print("symbol source returned no symbols:", url, "keys:", list(raw_payload.keys()) if isinstance(raw_payload, dict) else type(raw_payload).__name__)\n                      if "r.jina.ai" in url and isinstance(raw_payload, dict):\n                          print("Jina data type:", type(raw_payload.get("data")).__name__)\n                          if isinstance(raw_payload.get("data"), dict):\n                              print("Jina data keys:", list(raw_payload["data"].keys()))\n                              print("Jina content preview:", repr(str(raw_payload["data"].get("content", ""))[:1200]))
                  except Exception as e:
                      last = e
                      print("symbol source failed:", url, e)
              raise last or RuntimeError("All symbol sources returned zero symbols")

          spot = get_first_symbols([
              "https://data-api.binance.vision/api/v3/exchangeInfo?symbolStatus=TRADING",
              "https://api.binance.com/api/v3/exchangeInfo?symbolStatus=TRADING",
          ], attempts=2, timeout=20)

          # Derivatives are official Binance exchangeInfo data. If Binance's
          # derivative host blocks the GitHub runner, use a transparent public
          # mirror of the same /fapi/v1 and /dapi/v1 responses rather than
          # inventing or hardcoding symbols.
          try:
              usdm = get_first_symbols([
                  "https://fapi.binance.com/fapi/v1/exchangeInfo",
                  "https://r.jina.ai/https://fapi.binance.com/fapi/v1/exchangeInfo",
              ], attempts=2, timeout=30)
              coinm = get_first_symbols([
                  "https://dapi.binance.com/dapi/v1/exchangeInfo",
                  "https://r.jina.ai/https://dapi.binance.com/dapi/v1/exchangeInfo",
              ], attempts=2, timeout=30)
          except Exception as rest_error:
              print("Binance derivative REST discovery blocked; switching to Binance Futures WebSocket:", rest_error)
              import socket, ssl, base64, hashlib, os, struct, time
              ws_url_path = "/market/stream?streams=%21miniTicker%40arr/%21contractInfo"
              host = "fstream.binance.com"

              raw_sock = socket.create_connection((host, 443), timeout=12)
              ws = ssl.create_default_context().wrap_socket(raw_sock, server_hostname=host)
              key = base64.b64encode(os.urandom(16)).decode("ascii")
              request = (
                  "GET " + ws_url_path + " HTTP/1.1\\r\\n"
                  "Host: " + host + "\\r\\n"
                  "Upgrade: websocket\\r\\n"
                  "Connection: Upgrade\\r\\n"
                  "Sec-WebSocket-Key: " + key + "\\r\\n"
                  "Sec-WebSocket-Version: 13\\r\\n"
                  "Origin: https://www.binance.com\\r\\n"
                  "User-Agent: SIRE-Binance-Catalogue/1.0\\r\\n\\r\\n"
              ).encode("ascii")
              ws.sendall(request)

              response = b""
              while b"\\r\\n\\r\\n" not in response:
                  chunk = ws.recv(4096)
                  if not chunk:
                      raise RuntimeError("Binance WebSocket closed during handshake")
                  response += chunk
              if b" 101 " not in response.split(b"\\r\\n", 1)[0]:
                  raise RuntimeError("Binance WebSocket handshake failed: " + response[:200].decode("latin1", "ignore"))

              contracts = {}
              tickers = {}
              buffer = response.split(b"\\r\\n\\r\\n", 1)[1]
              deadline = time.time() + 20

              def send_pong(payload):
                  mask = os.urandom(4)
                  body = bytes(payload)
                  header = bytearray([0x8A])
                  length = len(body)
                  if length < 126:
                      header.append(0x80 | length)
                  elif length < 65536:
                      header.append(0x80 | 126)
                      header.extend(struct.pack("!H", length))
                  else:
                      header.append(0x80 | 127)
                      header.extend(struct.pack("!Q", length))
                  masked = bytes(body[i] ^ mask[i % 4] for i in range(length))
                  ws.sendall(bytes(header) + mask + masked)

              def read_frame():
                  nonlocal_buffer = None
                  while True:
                      first = ws.recv(2)
                      if len(first) < 2:
                          raise RuntimeError("Binance WebSocket frame truncated")
                      b1, b2 = first[0], first[1]
                      opcode = b1 & 0x0F
                      masked = (b2 & 0x80) != 0
                      length = b2 & 0x7F
                      if length == 126:
                          length = struct.unpack("!H", ws.recv(2))[0]
                      elif length == 127:
                          length = struct.unpack("!Q", ws.recv(8))[0]
                      mask = ws.recv(4) if masked else b""
                      payload = b""
                      while len(payload) < length:
                          chunk = ws.recv(min(65536, length - len(payload)))
                          if not chunk:
                              raise RuntimeError("Binance WebSocket frame truncated")
                          payload += chunk
                      if masked:
                          payload = bytes(payload[i] ^ mask[i % 4] for i in range(length))
                      if opcode == 9:
                          send_pong(payload)
                          continue
                      if opcode == 8:
                          raise RuntimeError("Binance WebSocket closed")
                      return opcode, payload

              try:
                  while time.time() < deadline:
                      opcode, payload = read_frame()
                      if opcode != 1:
                          continue
                      try:
                          message = json.loads(payload.decode("utf-8"))
                      except Exception:
                          continue
                      data = message.get("data", message)
                      if isinstance(data, list):
                          for row in data:
                              symbol = str(row.get("s") or "").strip()
                              if symbol:
                                  tickers[symbol] = row
                      elif isinstance(data, dict) and data.get("e") == "contractInfo":
                          symbol = str(data.get("s") or "").strip()
                          if symbol:
                              contracts[symbol] = data
                      if contracts and tickers:
                          has_um = any(int(x.get("st") or 0) == 1 for x in contracts.values())
                          has_cm = any(int(x.get("st") or 0) == 2 for x in contracts.values())
                          has_perp = any(str(x.get("ct") or "").upper() == "PERPETUAL" for x in contracts.values())
                          has_delivery = any(str(x.get("ct") or "").upper() != "PERPETUAL" for x in contracts.values())
                          if has_um and has_cm and has_perp and has_delivery:
                              break
              finally:
                  try:
                      ws.close()
                  except Exception:
                      pass

              rows = []
              merged = dict(tickers)
              for symbol, row in contracts.items():
                  merged.setdefault(symbol, row)

              for symbol, row in merged.items():
                  info = contracts.get(symbol, {})
                  st = int(info.get("st") or row.get("st") or 0)
                  if st not in (1, 2):
                      continue
                  ct = str(info.get("ct") or "").upper()
                  if not ct:
                      upper = symbol.upper()
                      ct = "PERPETUAL" if not ("_" in upper and not upper.endswith("_PERP")) else "CURRENT_QUARTER"
                  status = str(info.get("cs") or "TRADING").upper()
                  if status and status != "TRADING":
                      continue
                  rows.append({
                      "symbol": symbol,
                      "pair": str(row.get("ps") or info.get("ps") or symbol),
                      "baseAsset": "",
                      "quoteAsset": "",
                      "contractType": ct,
                      "deliveryDate": info.get("dt"),
                      "onboardDate": info.get("ot"),
                      "status": "TRADING",
                      "_streamType": st,
                  })

              um_stream = [r for r in rows if r["_streamType"] == 1]
              cm_stream = [r for r in rows if r["_streamType"] == 2]
              if not um_stream or not cm_stream:
                  raise RuntimeError("Binance Futures WebSocket returned no complete UM/CM symbol universe")

              for r in um_stream + cm_stream:
                  r.pop("_streamType", None)
                  pair = str(r.get("pair") or r.get("symbol") or "")
                  r["baseAsset"] = pair
                  r["quoteAsset"] = ""

              usdm = {"symbols": um_stream}
              coinm = {"symbols": cm_stream}
              print("Binance WebSocket symbol discovery:", json.dumps({
                  "um": len(um_stream),
                  "cm": len(cm_stream),
                  "perpetuals": sum(1 for x in rows if str(x.get("contractType")).upper() == "PERPETUAL"),
                  "futures": sum(1 for x in rows if str(x.get("contractType")).upper() != "PERPETUAL"),
              }))

          products = []
          for url in [
              "https://www.binance.com/bapi/apex/v1/friendly/apex/marketing/complianceSymbolList",
              "https://www.binance.com/exchange-api/v2/public/asset-service/product/get-products?includeEtf=true",
              "https://www.binance.com/bapi/asset/v2/public/asset-service/product/get-products?includeEtf=true",
          ]:
              try:
                  payload = get(url)
                  rows = payload.get("data") if isinstance(payload, dict) else None
                  if isinstance(rows, list):
                      products.extend(rows)
              except Exception as e:
                  print("metadata source failed:", url, e)

          meta = {}
          for row in products:
              base = str(row.get("b") or row.get("baseAsset") or row.get("base") or "").upper()
              if not base:
                  continue
              listing = row.get("listingTime") or row.get("listedAt") or row.get("onboardDate")
              entry = meta.setdefault(base, {})
              if listing and not entry.get("listedAt"):
                  entry["listedAt"] = listing
              if row.get("newListing") is True:
                  entry["newListing"] = True
              if row.get("an") or row.get("fullName") or row.get("name"):
                  entry["fullName"] = row.get("an") or row.get("fullName") or row.get("name")

          def normalize(rows, market_type, prefix="BINANCE"):
              out = []
              for r in rows.get("symbols", []):
                  status = str(r.get("status") or r.get("contractStatus") or "").upper()
                  if status and status != "TRADING":
                      continue
                  symbol = str(r.get("symbol") or "").strip()
                  if not symbol:
                      continue
                  base = str(r.get("baseAsset") or r.get("baseCoin") or "").strip()
                  quote = str(r.get("quoteAsset") or r.get("quoteCoin") or "").strip()
                  out.append({
                      "id": f"{prefix}:{market_type}:{symbol}",
                      "provider": "BINANCE",
                      "providerLabel": "Binance",
                      "exchange": "BINANCE",
                      "marketType": market_type,
                      "category": "Crypto",
                      "symbol": symbol,
                      "displaySymbol": symbol,
                      "name": f"{base} / {quote}" if base and quote else symbol,
                      "base": base or None,
                      "quote": quote or None,
                      "onboardDate": r.get("onboardDate"),
                      "listedAt": r.get("onboardDate") or r.get("listingTime") or r.get("listedAt"),
                      "expiry": r.get("deliveryDate") or r.get("expiryDate"),
                      "contractType": r.get("contractType"),
                      "settlement": r.get("marginAsset") or r.get("settleAsset") or r.get("settleCoin"),
                  })
              return out

          spot_rows = normalize(spot, "Spot")
          margin_rows = []
          for raw in spot.get("symbols", []):
              if raw.get("isMarginTradingAllowed") is not True:
                  continue
              margin_rows.extend(normalize({"symbols":[raw]}, "Margin"))
          um_rows = []
          for r in usdm.get("symbols", []):
              mt = "Perpetuals" if str(r.get("contractType","")).upper() == "PERPETUAL" else "Futures"
              um_rows.extend(normalize({"symbols":[r]}, mt))
          cm_rows = []
          for r in coinm.get("symbols", []):
              mt = "Perpetuals" if str(r.get("contractType","")).upper() == "PERPETUAL" else "Futures"
              cm_rows.extend(normalize({"symbols":[r]}, mt, "BINANCE:COIN-M"))

          if not um_rows and not cm_rows:
              raise RuntimeError("Binance derivative exchangeInfo returned zero trading instruments")
          if not any(x["marketType"] == "Perpetuals" for x in um_rows + cm_rows):
              raise RuntimeError("Binance derivative exchangeInfo returned zero Perpetuals")
          if not any(x["marketType"] == "Futures" for x in um_rows + cm_rows):
              raise RuntimeError("Binance derivative exchangeInfo returned zero Futures")

          payload = {
              "generatedAt": int(__import__("time").time() * 1000),
              "spot": spot_rows,
              "margin": margin_rows,
              "derivatives": um_rows + cm_rows,
              "metadata": meta,
          }
          Path("public/binance-catalogue.json").write_text(json.dumps(payload, separators=(",",":")), encoding="utf-8")
          print(json.dumps({
              "spot": len(spot_rows),
              "margin": len(margin_rows),
              "derivatives": len(um_rows)+len(cm_rows),
              "metadata": len(meta),
              "futures": sum(1 for x in um_rows + cm_rows if x["marketType"] == "Futures"),
              "perpetuals": sum(1 for x in um_rows + cm_rows if x["marketType"] == "Perpetuals"),
          }))

      - name: Commit refreshed catalogue
        shell: bash
        run: |
          git config user.name "sire-binance-catalogue"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/binance-catalogue.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh Binance market catalogue [skip ci]"
          git push origin HEAD:render-migration
