name: Refresh Binance market catalogue

on:
  push:
    branches: [render-migration]
    paths:
      - '.github/workflows/update-binance-catalogue.yml'
      - 'src/App.tsx'
      - 'backend/market-catalog.ts'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: render-migration

      - name: Fetch official Binance catalogues
        shell: python
        run: |
          import json, urllib.request, urllib.error, os
          from pathlib import Path

          def get(url, attempts=4, timeout=45):
              req = urllib.request.Request(url, headers={
                  "Accept": "application/json",
                  "User-Agent": "SIRE-Binance-Catalogue/1.0",
              })
              last = None
              for attempt in range(attempts):
                  try:
                      with urllib.request.urlopen(req, timeout=timeout) as r:
                          return json.loads(r.read().decode("utf-8"))
                  except Exception as e:
                      last = e
                      print(f"fetch attempt {attempt + 1}/{attempts} failed:", url, e)
                      if attempt + 1 < attempts:
                          import time
                          time.sleep(2 * (attempt + 1))
              raise last

          # Binance may return HTTP 451 to hosted runners. For every catalogue
          # family, accept only a response containing a real symbols[] array.
          # data-api.binance.vision is Binance's public market-data host.
          def unwrap_symbol_payload(value, depth=0):
              if depth > 5:
                  return None
              if isinstance(value, dict):
                  if isinstance(value.get("symbols"), list) and value["symbols"]:
                      return value
                  for key in ("data", "content", "text", "body", "result"):
                      if key in value:
                          found = unwrap_symbol_payload(value[key], depth + 1)
                          if found:
                              return found
                  return None
              if isinstance(value, str):
                  text_value = value.strip()
                  candidates = []
                  if "```" in text_value:
                      for chunk in text_value.split("```"):
                          chunk = chunk.strip()
                          if chunk.startswith("json"):
                              chunk = chunk[4:].strip()
                          if chunk:
                              candidates.append(chunk)
                  candidates.append(text_value)
                  symbol_marker = text_value.find('"symbols"')
                  if symbol_marker >= 0:
                      start = text_value.rfind("{", 0, symbol_marker)
                      if start >= 0:
                          try:
                              decoded, _ = json.JSONDecoder().raw_decode(text_value[start:])
                              found = unwrap_symbol_payload(decoded, depth + 1)
                              if found:
                                  return found
                          except Exception:
                              pass
                  first = text_value.find("{")
                  last = text_value.rfind("}")
                  if first >= 0 and last > first:
                      candidates.append(text_value[first:last + 1])
                  for candidate in candidates:
                      try:
                          decoded = json.loads(candidate)
                          found = unwrap_symbol_payload(decoded, depth + 1)
                          if found:
                              return found
                      except Exception:
                          pass
                  return None
              return None

          def get_first_symbols(urls, attempts=1, timeout=12):
              last = None
              for url in urls:
                  try:
                      raw_payload = get(url, attempts=attempts, timeout=timeout)
                      payload = unwrap_symbol_payload(raw_payload) or raw_payload
                      rows = payload.get("symbols") if isinstance(payload, dict) else None
                      if isinstance(rows, list) and rows:
                          print("symbol source succeeded:", url, "symbols:", len(rows))
                          return payload
                      print("symbol source returned no symbols:", url, "keys:", list(raw_payload.keys()) if isinstance(raw_payload, dict) else type(raw_payload).__name__)
                  except Exception as e:
                      last = e
                      print("symbol source failed:", url, e)
              raise last or RuntimeError("All symbol sources returned zero symbols")

          spot = get_first_symbols([
              "https://data-api.binance.vision/api/v3/exchangeInfo?symbolStatus=TRADING",
              "https://api.binance.com/api/v3/exchangeInfo?symbolStatus=TRADING",
          ], attempts=2, timeout=20)

          # Binance derivative REST/WebSocket hosts can be region-blocked from
          # hosted runners. Binance Vision is the official public-data archive.
          # Identify currently active contracts by checking recent daily kline
          # objects, so every emitted symbol has real recent Binance data.
          import datetime, concurrent.futures, xml.etree.ElementTree as ET

          def vision_active_symbols(market):
              prefix = "data/futures/" + market + "/daily/klines/"
              symbols = []
              token = ""
              while True:
                  params = {"prefix": prefix, "delimiter": "/", "max-keys": "1000"}
                  if token:
                      params["continuation-token"] = token
                  url = "https://data.binance.vision/?" + urllib.parse.urlencode(params)
                  req = urllib.request.Request(url, headers={"User-Agent": "SIRE-Binance-Catalogue/1.0"})
                  with urllib.request.urlopen(req, timeout=30) as response:
                      xml = response.read()
                  print("Binance Vision listing response:", repr(xml[:800]))
                  root = ET.fromstring(xml)
                  ns = {"s3": "http://s3.amazonaws.com/doc/2006-03-01/"}
                  for node in root.findall(".//s3:CommonPrefixes/s3:Prefix", ns):
                      value = str(node.text or "")
                      if value.startswith(prefix):
                          symbol = value[len(prefix):].strip("/")
                          if symbol:
                              symbols.append(symbol)
                  token_node = root.find(".//s3:NextContinuationToken", ns)
                  token = str(token_node.text or "") if token_node is not None else ""
                  if not token:
                      break
              return sorted(set(symbols))

          def vision_object_exists(market, symbol, day):
              key = "data/futures/" + market + "/daily/klines/" + urllib.parse.quote(symbol, safe="") + "/1d/" + urllib.parse.quote(symbol, safe="") + "-1d-" + day.strftime("%Y-%m-%d") + ".zip"
              url = "https://data.binance.vision/" + key
              try:
                  req = urllib.request.Request(url, method="HEAD", headers={"User-Agent": "SIRE-Binance-Catalogue/1.0"})
                  with urllib.request.urlopen(req, timeout=10) as response:
                      return 200 <= response.status < 400
              except Exception:
                  return False

          def vision_derivative_exchange_info(market):
              candidates = vision_active_symbols(market)
              days = [datetime.date.today() - datetime.timedelta(days=n) for n in (1, 2, 3)]
              active = []
              def check(symbol):
                  return symbol if any(vision_object_exists(market, symbol, day) for day in days) else None
              with concurrent.futures.ThreadPoolExecutor(max_workers=32) as pool:
                  for symbol in pool.map(check, candidates):
                      if symbol:
                          active.append(symbol)

              rows = []
              for symbol in active:
                  upper = symbol.upper()
                  is_delivery = "_" in upper and not upper.endswith("_PERP")
                  contract_type = "CURRENT_QUARTER" if is_delivery else "PERPETUAL"
                  pair = upper.split("_", 1)[0]
                  quote = ""
                  base = pair
                  for suffix in ("USDT", "USDC", "BUSD", "USD"):
                      if pair.endswith(suffix) and len(pair) > len(suffix):
                          quote = suffix
                          base = pair[:-len(suffix)]
                          break
                  rows.append({
                      "symbol": upper,
                      "pair": pair,
                      "contractType": contract_type,
                      "deliveryDate": None,
                      "onboardDate": None,
                      "status": "TRADING",
                      "baseAsset": base,
                      "quoteAsset": quote,
                  })
              return {"symbols": rows}

          try:
              usdm = get_first_symbols([
                  "https://fapi.binance.com/fapi/v1/exchangeInfo",
              ], attempts=1, timeout=8)
              coinm = get_first_symbols([
                  "https://dapi.binance.com/dapi/v1/exchangeInfo",
              ], attempts=1, timeout=8)
          except Exception as rest_error:
              print("Binance derivative REST blocked; using Binance Vision recent-data discovery:", rest_error)
              usdm = vision_derivative_exchange_info("um")
              coinm = vision_derivative_exchange_info("cm")
              print("Binance Vision derivative discovery:", json.dumps({
                  "um": len(usdm.get("symbols", [])),
                  "cm": len(coinm.get("symbols", [])),
                  "futures": sum(1 for x in usdm.get("symbols", []) + coinm.get("symbols", []) if x["contractType"] != "PERPETUAL"),
                  "perpetuals": sum(1 for x in usdm.get("symbols", []) + coinm.get("symbols", []) if x["contractType"] == "PERPETUAL"),
              }))

          products = []
          for url in [
              "https://www.binance.com/bapi/apex/v1/friendly/apex/marketing/complianceSymbolList",
              "https://www.binance.com/exchange-api/v2/public/asset-service/product/get-products?includeEtf=true",
              "https://www.binance.com/bapi/asset/v2/public/asset-service/product/get-products?includeEtf=true",
          ]:
              try:
                  payload = get(url)
                  rows = payload.get("data") if isinstance(payload, dict) else None
                  if isinstance(rows, list):
                      products.extend(rows)
              except Exception as e:
                  print("metadata source failed:", url, e)

          meta = {}
          for row in products:
              base = str(row.get("b") or row.get("baseAsset") or row.get("base") or "").upper()
              if not base:
                  continue
              listing = row.get("listingTime") or row.get("listedAt") or row.get("onboardDate")
              entry = meta.setdefault(base, {})
              if listing and not entry.get("listedAt"):
                  entry["listedAt"] = listing
              if row.get("newListing") is True:
                  entry["newListing"] = True
              if row.get("an") or row.get("fullName") or row.get("name"):
                  entry["fullName"] = row.get("an") or row.get("fullName") or row.get("name")
              for source_key, target_key in [
                  ("marketGroup","marketGroup"),("marketSubcategory","marketSubcategory"),("marketFilter","marketFilter"),
                  ("category","category"),("productType","productType"),("instrumentType","instrumentType"),
                  ("underlyingType","underlyingType"),("underlyingSubType","underlyingSubType"),
                  ("sector","sector"),("theme","theme"),("quoteAsset","quoteAsset"),
                  ("listingType","listingType"),("newListing","newListing")
              ]:
                  if row.get(source_key) is not None:
                      entry[target_key] = row.get(source_key)

          def normalize(rows, market_type, prefix="BINANCE"):
              out = []
              for r in rows.get("symbols", []):
                  status = str(r.get("status") or r.get("contractStatus") or "").upper()
                  if status and status != "TRADING":
                      continue
                  symbol = str(r.get("symbol") or "").strip()
                  if not symbol:
                      continue
                  base = str(r.get("baseAsset") or r.get("baseCoin") or "").strip()
                  quote = str(r.get("quoteAsset") or r.get("quoteCoin") or "").strip()
                  out.append({
                      "id": f"{prefix}:{market_type}:{symbol}",
                      "provider": "BINANCE",
                      "providerLabel": "Binance",
                      "exchange": "BINANCE",
                      "marketType": market_type,
                      "category": "Crypto",
                      "symbol": symbol,
                      "displaySymbol": symbol,
                      "name": f"{base} / {quote}" if base and quote else symbol,
                      "base": base or None,
                      "quote": quote or None,
                      "onboardDate": r.get("onboardDate"),
                      "listedAt": r.get("onboardDate") or r.get("listingTime") or r.get("listedAt"),
                      "expiry": r.get("deliveryDate") or r.get("expiryDate"),
                      "contractType": r.get("contractType"),
                      "settlement": r.get("marginAsset") or r.get("settleAsset") or r.get("settleCoin"),
                      "underlyingType": r.get("underlyingType"),
                      "underlyingSubType": r.get("underlyingSubType"),
                      "newListing": r.get("newListing"),
                  })
              return out

          spot_rows = normalize(spot, "Spot")
          margin_rows = []
          for raw in spot.get("symbols", []):
              if raw.get("isMarginTradingAllowed") is not True:
                  continue
              margin_rows.extend(normalize({"symbols":[raw]}, "Margin"))
          um_rows = []
          for r in usdm.get("symbols", []):
              mt = "Perpetuals" if str(r.get("contractType","")).upper() == "PERPETUAL" else "Futures"
              um_rows.extend(normalize({"symbols":[r]}, mt))
          cm_rows = []
          for r in coinm.get("symbols", []):
              mt = "Perpetuals" if str(r.get("contractType","")).upper() == "PERPETUAL" else "Futures"
              cm_rows.extend(normalize({"symbols":[r]}, mt, "BINANCE:COIN-M"))

          if not um_rows and not cm_rows:
              raise RuntimeError("Binance derivative exchangeInfo returned zero trading instruments")
          if not any(x["marketType"] == "Perpetuals" for x in um_rows + cm_rows):
              raise RuntimeError("Binance derivative exchangeInfo returned zero Perpetuals")
          if not any(x["marketType"] == "Futures" for x in um_rows + cm_rows):
              raise RuntimeError("Binance derivative exchangeInfo returned zero Futures")

          payload = {
              "generatedAt": int(__import__("time").time() * 1000),
              "spot": spot_rows,
              "margin": margin_rows,
              "derivatives": um_rows + cm_rows,
              "metadata": meta,
          }
          Path("public/binance-catalogue.json").write_text(json.dumps(payload, separators=(",",":")), encoding="utf-8")
          print(json.dumps({
              "spot": len(spot_rows),
              "margin": len(margin_rows),
              "derivatives": len(um_rows)+len(cm_rows),
              "metadata": len(meta),
              "futures": sum(1 for x in um_rows + cm_rows if x["marketType"] == "Futures"),
              "perpetuals": sum(1 for x in um_rows + cm_rows if x["marketType"] == "Perpetuals"),
          }))

      - name: Commit refreshed catalogue
        shell: bash
        run: |
          git config user.name "sire-binance-catalogue"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/binance-catalogue.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh Binance market catalogue [skip ci]"
          git push origin HEAD:render-migration
