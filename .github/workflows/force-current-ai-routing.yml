name: Force current SIRE AI routing

on:
  push:
    branches: [render-migration]

permissions:
  contents: write

jobs:
  force-current-routing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace every retired NVIDIA model reference
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('backend/index.ts')
          s = p.read_text()

          # Replace any legacy model identifiers regardless of the surrounding implementation.
          s = s.replace('openai/gpt-oss-120b', 'moonshotai/kimi-k3')
          s = s.replace('moonshotai/kimi-k2.6', 'moonshotai/kimi-k3')
          s = s.replace('Kimi K2.6', 'Kimi K3')
          s = s.replace('GPT-OSS 120B', 'Kimi K3')
          s = s.replace('GPT-OSS', 'Kimi K3')

          # If the model array is present, make Kimi K3 primary and DeepSeek V4 Pro fallback.
          pattern = r"const AI_MODELS = \[.*?\] as const;"
          replacement = """const AI_MODELS = [
            { id: 'moonshotai/kimi-k3', name: 'Kimi K3', thinking: true },
            { id: 'deepseek-ai/deepseek-v4-pro-0813', name: 'DeepSeek V4 Pro', reasoning_effort: 'max' },
          ] as const;"""
          s = re.sub(pattern, replacement, s, count=1, flags=re.S)

          if 'openai/gpt-oss-120b' in s:
              raise SystemExit('Retired NVIDIA GPT-OSS model reference remains in backend/index.ts')
          if 'moonshotai/kimi-k3' not in s:
              raise SystemExit('Kimi K3 routing is missing')
          if 'deepseek-ai/deepseek-v4-pro-0813' not in s:
              raise SystemExit('DeepSeek V4 Pro fallback is missing')

          p.write_text(s)
          PY

      - name: Commit only if backend changed
        shell: bash
        run: |
          if git diff --quiet -- backend/index.ts; then
            echo 'AI routing already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/index.ts
          git commit -m 'fix: force SIRE to Kimi K3 with DeepSeek fallback'
          git push
