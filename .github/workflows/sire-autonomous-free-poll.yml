name: SIRE Autonomous Agent

on:
  schedule:
    - cron: "* * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: sire-autonomous-agent
  cancel-in-progress: false

jobs:
  autonomous:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout SIRE autonomous engine
        uses: actions/checkout@v4
        with:
          ref: render-migration
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run the same SIRE AI used by chat
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AUTONOMOUS_STATE_ISSUE_NUMBER: "10"
          SIRE_AUTONOMOUS_SYMBOL: "WLDAUD"
          SIRE_AUTONOMOUS_INTERVAL: "1m"
          SIRE_AUTONOMOUS_CANDLE_COUNT: "100"
          SIRE_AUTONOMOUS_SAMPLES: "5"
          SIRE_AUTONOMOUS_SAMPLE_INTERVAL_SECONDS: "60"
        run: npm run autonomous:sire-cycle
