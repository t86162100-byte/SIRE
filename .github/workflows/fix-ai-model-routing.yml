name: Fix SIRE AI model routing

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-ai-model-routing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install current NVIDIA Kimi + DeepSeek routing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('backend/index.ts')
          s = p.read_text()

          # NVIDIA remains the sole provider. Use current NVIDIA-hosted Kimi/DeepSeek models.
          s = re.sub(
              r"const AI_MODELS = \[.*?\] as const;\nconst OPENAI_MODEL = AI_MODELS\[0\]\.id;",
              """const AI_MODELS = [
            { id: 'moonshotai/kimi-k3', name: 'Kimi K3', thinking: true },
            { id: 'deepseek-ai/deepseek-v4-pro-0813', name: 'DeepSeek V4 Pro', reasoning_effort: 'max' },
          ] as const;
          const OPENAI_MODEL = AI_MODELS[0].id;""",
              s,
              count=1,
              flags=re.S,
          )

          s = s.replace('moonshotai/kimi-k2.6', 'moonshotai/kimi-k3')
          s = s.replace('Kimi K2.6', 'Kimi K3')
          s = s.replace("provider: 'NVIDIA', configured", "provider: 'NVIDIA-hosted Kimi/DeepSeek', configured")
          s = s.replace("NVIDIA-hosted GPT-OSS 120B intelligence operating inside the SIRE environment", "NVIDIA-hosted Kimi K3 with DeepSeek V4 Pro fallback operating inside the SIRE environment")

          if 'openai/gpt-oss-120b' in s:
              raise SystemExit('Retired GPT-OSS model reference still present in backend/index.ts')
          if 'moonshotai/kimi-k3' not in s:
              raise SystemExit('Kimi K3 routing was not installed')
          if 'deepseek-ai/deepseek-v4-pro-0813' not in s:
              raise SystemExit('DeepSeek V4 Pro routing was not installed')

          p.write_text(s)
          print('Installed NVIDIA Kimi K3 primary + DeepSeek V4 Pro fallback routing.')
          PY

      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet -- backend/index.ts; then
            echo 'No backend change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/index.ts
          git commit -m 'fix: route SIRE through NVIDIA Kimi and DeepSeek'
          git push
